<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ЭХО РУИН — прототип</title>
<style>
  html, body { margin:0; padding:0; background:#0a0e14; height:100%; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#0a0e14; max-width:100vw; max-height:100vh; }
  #overlay { position:fixed; inset:0; background:rgba(5,8,12,.88); display:flex; flex-direction:column;
             align-items:center; justify-content:center; color:#cfe8ff; font-family:'Segoe UI',Arial,sans-serif;
             text-align:center; z-index:10; cursor:pointer; }
  #overlay h1 { color:#43e8d8; font-size:42px; margin:0 0 10px; letter-spacing:4px; }
  #overlay p  { margin:6px 0; color:#9fb3c8; font-size:16px; }
  #overlay .go { margin-top:22px; color:#fff; border:1px solid #43e8d8; padding:10px 26px; border-radius:6px; font-size:18px; }
  #touch { position:fixed; bottom:0; left:0; right:0; display:none; z-index:5; user-select:none; }
  #touch div { position:absolute; bottom:14px; width:64px; height:64px; border-radius:50%;
               background:rgba(67,232,216,.18); border:1px solid rgba(67,232,216,.55); color:#cfe8ff;
               font-size:13px; display:flex; align-items:center; justify-content:center; font-family:sans-serif; }
  #err { position:fixed; top:0; left:0; right:0; background:#5a1f1f; color:#ffd9d9; font:14px monospace;
         padding:8px; display:none; z-index:99; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="err"></div>
<div id="wrap"><canvas id="cv" width="960" height="540" tabindex="0"></canvas></div>

<div id="overlay">
  <h1>ЭХО РУИН</h1>
  <p>Клик — начать (или любая клавиша)</p>
  <p>&#8592; &#8594; или A/D — движение &nbsp;&nbsp; ПРОБЕЛ — прыжок</p>
  <p>X — рывок (оглушает врагов) &nbsp;&nbsp; E — ЭХО-ИМПУЛЬС (открывает мосты)</p>
  <p>Дойдите до светящегося ядра в конце уровня</p>
  <div class="go">НАЧАТЬ</div>
</div>

<div id="touch">
  <div style="left:16px;"   data-k="left">&#8592;</div>
  <div style="left:92px;"   data-k="right">&#8594;</div>
  <div style="right:92px;"  data-k="jump">JUMP</div>
  <div style="right:16px;"  data-k="pulse">PULSE</div>
  <div style="right:168px;" data-k="dash">DASH</div>
</div>

<script>
// --- показ любых ошибок на экране, чтобы их было видно без консоли ---
window.onerror = function(msg, src, line) {
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'Ошибка: ' + msg + ' (строка ' + line + ')';
};

(function() {
'use strict';

var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = cv.width, H = cv.height;

// ---------- ввод ----------
var keys = { left:false, right:false, jump:false, jumpPressed:false, dash:false, dashPressed:false, pulsePressed:false };

window.addEventListener('keydown', function(e) {
  var k = e.code || e.key;
  if (k === 'ArrowLeft'  || k === 'KeyA') keys.left = true;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') { keys.jump = true; keys.jumpPressed = true; }
  if (k === 'KeyX' || k === 'ShiftLeft' || k === 'ShiftRight') { keys.dash = true; keys.dashPressed = true; }
  if (k === 'KeyE' || k === 'KeyF') keys.pulsePressed = true;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(k) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e) {
  var k = e.code || e.key;
  if (k === 'ArrowLeft'  || k === 'KeyA') keys.left = false;
  if (k === 'ArrowRight' || k === 'KeyD') keys.right = false;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') keys.jump = false;
  if (k === 'KeyX' || k === 'ShiftLeft' || k === 'ShiftRight') keys.dash = false;
});

// сенсорные кнопки — появляются на телефонах
if ('ontouchstart' in window) document.getElementById('touch').style.display = 'block';
var touchEls = document.getElementById('touch').children;
for (var ti = 0; ti < touchEls.length; ti++) {
  (function(el) {
    var k = el.getAttribute('data-k');
    var press = function(e) { e.preventDefault();
      if (k === 'left' || k === 'right') keys[k] = true;
      if (k === 'jump') { keys.jump = true; keys.jumpPressed = true; }
      if (k === 'dash') { keys.dash = true; keys.dashPressed = true; }
      if (k === 'pulse') keys.pulsePressed = true;
    };
    var release = function(e) {
      if (k === 'left' || k === 'right') keys[k] = false;
      if (k === 'jump') keys.jump = false;
      if (k === 'dash') keys.dash = false;
    };
    el.addEventListener('touchstart', press, {passive:false});
    el.addEventListener('touchend', release);
    el.addEventListener('touchcancel', release);
  })(touchEls[ti]);
}

// ---------- уровни ----------
// platform: {x,y,w,h}; spikes: {x,y,w}; enemy: {x,y,minX,maxX}; bridge: скрытая платформа, открывается импульсом
var LEVELS = [
  { // Уровень 1: "Бетоновый Прибой"
    width: 3600, spawnX: 60, spawnY: 470,
    platforms: [
      {x:0,y:520,w:600,h:130}, {x:700,y:520,w:420,h:130}, {x:1220,y:520,w:330,h:130},
      {x:1900,y:520,w:420,h:130}, {x:2420,y:460,w:200,h:60}, {x:2700,y:520,w:900,h:130},
      {x:980,y:400,w:130,h:20}, {x:2100,y:390,w:130,h:20}
    ],
    bridges: [ {x:1650,y:520,w:250,h:16} ],
    spikes: [ {x:1020,y:520,w:60}, {x:2000,y:520,w:50}, {x:2900,y:520,w:80} ],
    enemies: [ {x:800,y:470,minX:720,maxX:1080}, {x:1350,y:470,minX:1240,maxX:1520}, {x:2900,y:470,minX:2720,maxX:3560} ],
    checkpoints: [ {x:1240,y:470} ],
    core: {x:3480,y:440}
  },
  { // Уровень 2: "Сад Датчиков"
    width: 4200, spawnX: 60, spawnY: 470,
    platforms: [
      {x:0,y:520,w:480,h:130}, {x:580,y:460,w:280,h:60}, {x:960,y:520,w:320,h:130},
      {x:1620,y:520,w:360,h:130}, {x:2080,y:420,w:200,h:40}, {x:2360,y:520,w:340,h:130},
      {x:2800,y:440,w:180,h:40}, {x:3060,y:520,w:1140,h:130},
      {x:820,y:360,w:120,h:18}, {x:1180,y:300,w:120,h:18}, {x:2180,y:300,w:110,h:18}
    ],
    bridges: [ {x:1300,y:520,w:300,h:16}, {x:2700,y:520,w:100,h:16} ],
    spikes: [ {x:1060,y:520,w:50}, {x:1700,y:520,w:50}, {x:3500,y:520,w:100} ],
    enemies: [ {x:620,y:400,minX:585,maxX:830}, {x:1050,y:470,minX:965,maxX:1250}, {x:1750,y:470,minX:1640,maxX:1940}, {x:3300,y:470,minX:3080,maxX:4140} ],
    checkpoints: [ {x:970,y:470}, {x:2400,y:470} ],
    core: {x:4080,y:440}
  }
];

// ---------- состояние ----------
var state = 'menu';          // menu | play | win
var levelIdx = 0, lvl = null;
var player, enemies, bridges, ring, diff, deaths, lastDeath, camX, t;
var PULSE_RADIUS = 340, PULSE_DUR = 300;   // мост открыт 5 секунд (300 кадров @60fps)

function loadLevel(i) {
  lvl = LEVELS[i];
  player = { x:lvl.spawnX, y:lvl.spawnY, w:28, h:36, vx:0, vy:0, onGround:false,
             coyote:0, buffer:0, dashT:0, dashCd:0, invuln:0, hp:3, face:1, pulseCd:0 };
  enemies = [];
  for (var j = 0; j < lvl.enemies.length; j++) {
    var e = lvl.enemies[j];
    enemies.push({ x:e.x, y:e.y, w:30, h:30, dir:1, stun:0, baseX:e.x, minX:e.minX, maxX:e.maxX, flash:0 });
  }
  bridges = [];
  for (var b = 0; b < lvl.bridges.length; b++) bridges.push({ r:lvl.bridges[b], timer:0 });
  ring = null; camX = 0; t = 0;
  if (i === 0) { diff = 1; deaths = 0; lastDeath = -999; }
}

function respawn() {
  player.x = lvl.spawnX; player.y = lvl.spawnY;
  // возвращаем на последний чекпоинт
  for (var i = 0; i < lvl.checkpoints.length; i++) {
    var c = lvl.checkpoints[i];
    if (player.lastCheck && c.x <= player.lastCheck) { player.x = c.x; player.y = c.y; }
  }
  player.vx = 0; player.vy = 0; player.hp = 3; player.invuln = 60; player.dashT = 0;
}

function hitPlayer() {
  if (player.invuln > 0 || player.dashT > 0) return;
  player.hp--; player.invuln = 70;
  if (player.hp <= 0) {
    deaths++; lastDeath = t;
    diff = Math.min(1.5, diff + 0.15);
    respawn();
  }
}

function firePulse() {
  if (player.pulseCd > 0) return;
  player.pulseCd = 180;
  ring = { x:player.x + player.w/2, y:player.y + player.h/2, r:0 };
  for (var b = 0; b < bridges.length; b++) bridges[b].timer = PULSE_DUR;
  for (var e = 0; e < enemies.length; e++) {
    var en = enemies[e];
    var dx = (en.x + en.w/2) - ring.x, dy = (en.y + en.h/2) - ring.y;
    if (dx*dx + dy*dy <= PULSE_RADIUS*PULSE_RADIUS) { en.stun = 180; en.flash = 30; }
  }
}

// ---------- физика ----------
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function solidRects() {
  var list = [];
  for (var i = 0; i < lvl.platforms.length; i++) list.push(lvl.platforms[i]);
  for (var b = 0; b < bridges.length; b++) if (bridges[b].timer > 0) list.push(bridges[b].r);
  return list;
}

function moveX(rects, dx) {
  player.x += dx;
  for (var i = 0; i < rects.length; i++) {
    if (overlap(player, rects[i])) {
      if (dx > 0) player.x = rects[i].x - player.w;
      else if (dx < 0) player.x = rects[i].x + rects[i].w;
      player.vx = 0;
    }
  }
}

function moveY(rects, dy) {
  player.y += dy;
  for (var i = 0; i < rects.length; i++) {
    if (overlap(player, rects[i])) {
      if (dy > 0) { player.y = rects[i].y - player.h; player.vy = 0; player.onGround = true; }
      else if (dy < 0) { player.y = rects[i].y + rects[i].h; player.vy = 0; }
    }
  }
}

function update() {
  t++;
  if (player.pulseCd > 0) player.pulseCd--;
  if (keys.pulsePressed) { keys.pulsePressed = false; firePulse(); }

  // движение
  var acc = 0.5, maxV = 4.2;
  if (keys.left)  { player.vx = Math.max(player.vx - acc, -maxV); player.face = -1; }
  if (keys.right) { player.vx = Math.min(player.vx + acc,  maxV); player.face = 1; }
  if (!keys.left && !keys.right) player.vx *= 0.82;

  // прыжок: coyote time + jump buffer
  if (player.onGround) player.coyote = 8; else if (player.coyote > 0) player.coyote--;
  if (player.buffer > 0) player.buffer--;
  if (keys.jumpPressed) { keys.jumpPressed = false; player.buffer = 8; }
  if (player.buffer > 0 && player.coyote > 0) {
    player.vy = -11.5; player.coyote = 0; player.buffer = 0; player.onGround = false;
  }
  // регулируемый прыжок: отпустил кнопку — прыжок обрезается
  if (player.vy < -4 && !keys.jump) player.vy = -4;

  // рывок
  if (player.dashCd > 0) player.dashCd--;
  if (keys.dashPressed) { keys.dashPressed = false;
    if (player.dashCd <= 0) { player.dashT = 10; player.dashCd = 70; player.invuln = Math.max(player.invuln, 14); }
  }
  if (player.dashT > 0) { player.dashT--; player.vx = player.face * 12; player.vy = 0; }

  player.vy += 0.55;
  if (player.vy > 14) player.vy = 14;
  if (player.invuln > 0) player.invuln--;

  var rects = solidRects();
  player.onGround = false;
  moveX(rects, player.vx);
  moveY(rects, player.vy);

  // мосты угасают
  for (var b = 0; b < bridges.length; b++) if (bridges[b].timer > 0) bridges[b].timer--;

  // шипы
  for (var s = 0; s < lvl.spikes.length; s++) {
    var sp = lvl.spikes[s];
    if (overlap(player, {x:sp.x, y:sp.y - 16, w:sp.w, h:16})) hitPlayer();
  }

  // падение в пропасть
  if (player.y > H + 300) {
    deaths++; lastDeath = t;
    diff = Math.min(1.5, diff + 0.15);
    respawn();
  }

  // враги
  for (var e = 0; e < enemies.length; e++) {
    var en = enemies[e];
    if (en.stun > 0) { en.stun--; if (en.flash > 0) en.flash--; continue; }
    var dx = player.x - en.x, dist = Math.abs(dx), chasing = false;
    if (dist < 260 && Math.abs(player.y - en.y) < 90 && player.x > lvl.spawnX) chasing = true;
    var sp2 = (chasing ? 2.1 : 1.3) * diff;
    if (chasing) en.dir = dx > 0 ? 1 : -1;
    else {
      if (en.x <= en.minX) en.dir = 1;
      if (en.x + en.w >= en.maxX) en.dir = -1;
    }
    var nx = en.x + en.dir * sp2;
    // патруль не падает с платформы (проверка земли впереди)
    if (!chasing) {
      var probe = {x: en.dir > 0 ? en.x + en.w + 4 : en.x - 8, y: en.y + en.h + 2, w:4, h:8};
      var ground = false;
      for (var i = 0; i < lvl.platforms.length; i++) if (overlap(probe, lvl.platforms[i])) { ground = true; break; }
      if (!ground) en.dir *= -1; else en.x = nx;
    } else en.x = nx;
    en.y += 0.55; // упрощённая гравитация врагов (стоп по платформе ниже)
    var landed = false;
    for (var p = 0; p < lvl.platforms.length; p++) {
      var pl = lvl.platforms[p];
      if (overlap(en, pl) && en.vy >= 0) { en.y = pl.y - en.h; landed = true; }
    }
    if (!landed && en.y > 900) { en.y = lvl.enemies[e].y; en.x = lvl.enemies[e].x; }
    else if (landed) en.vy = 0; else en.vy = (en.vy || 0) + 0.55;

    // контакт с игроком
    if (overlap(player, en)) {
      if (player.dashT > 0) { en.stun = 180; en.flash = 30; }  // рывок оглушает
      else hitPlayer();
    }
  }

  // кольцо импульса расширяется
  if (ring) { ring.r += 9; if (ring.r > PULSE_RADIUS + 60) ring = null; }

  // чекпоинт
  for (var c = 0; c < lvl.checkpoints.length; c++) {
    var cp = lvl.checkpoints[c];
    if (Math.abs(player.x - cp.x) < 30) player.lastCheck = cp.x;
  }

  // финиш
  var core = lvl.core;
  if (Math.abs(player.x - core.x) < 40 && Math.abs(player.y - core.y) < 80) {
    if (levelIdx < LEVELS.length - 1) { levelIdx++; loadLevel(levelIdx); }
    else state = 'win';
  }

  // адаптивная сложность: полминуты без смертей — немного мягче
  if (t - lastDeath > 1800 && diff > 0.8) diff = Math.max(0.8, diff - 0.01);

  // камера
  var target = player.x - W/2 + player.w/2;
  camX += (Math.max(0, Math.min(target, lvl.width - W)) - camX) * 0.12;
}

// ---------- отрисовка ----------
function draw() {
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1220'); g.addColorStop(1, '#101c2b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-Math.round(camX), 0);

  // платформы
  for (var i = 0; i < lvl.platforms.length; i++) {
    var p = lvl.platforms[i];
    ctx.fillStyle = '#1c2b3d'; ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = '#2c4a63'; ctx.fillRect(p.x, p.y, p.w, 6);
  }
  // мосты: активные — бирюзовые, неактивные — пунктирный контур
  for (var b = 0; b < bridges.length; b++) {
    var br = bridges[b].r, on = bridges[b].timer > 0;
    if (on) { ctx.fillStyle = '#43e8d8'; ctx.fillRect(br.x, br.y, br.w, br.h); }
    else { ctx.strokeStyle = 'rgba(67,232,216,.35)'; ctx.setLineDash([6,6]);
           ctx.strokeRect(br.x, br.y, br.w, br.h); ctx.setLineDash([]); }
  }
  // шипы
  ctx.fillStyle = '#e8574f';
  for (var s = 0; s < lvl.spikes.length; s++) {
    var sp = lvl.spikes[s];
    for (var x = sp.x; x < sp.x + sp.w; x += 20) {
      ctx.beginPath(); ctx.moveTo(x, sp.y); ctx.lineTo(x + 10, sp.y - 18); ctx.lineTo(x + 20, sp.y); ctx.closePath(); ctx.fill();
    }
  }
  // чекпоинты
  for (var c = 0; c < lvl.checkpoints.length; c++) {
    var cp = lvl.checkpoints[c];
    ctx.fillStyle = (player.lastCheck && player.lastCheck >= cp.x) ? '#43e8d8' : '#5a6b7d';
    ctx.fillRect(cp.x, cp.y - 50, 4, 50); ctx.fillRect(cp.x - 8, cp.y - 50, 20, 6);
  }
  // ядро
  var core = lvl.core;
  ctx.fillStyle = 'rgba(243,196,72,.25)';
  ctx.beginPath(); ctx.arc(core.x + 14, core.y + 14, 30 + Math.sin(t/20)*4, 0, 7); ctx.fill();
  ctx.fillStyle = '#f3c448';
  ctx.beginPath(); ctx.arc(core.x + 14, core.y + 14, 14, 0, 7); ctx.fill();

  // враги
  for (var e = 0; e < enemies.length; e++) {
    var en = enemies[e];
    if (en.stun > 0) {
      ctx.fillStyle = en.flash > 0 ? '#ffffff' : '#7a8aa0';
    } else ctx.fillStyle = '#e08a3c';
    ctx.fillRect(en.x, en.y, en.w, en.h);
    ctx.fillStyle = '#0a0e14';
    var eye = en.stun > 0 ? 2 : 4;
    ctx.fillRect(en.x + 6, en.y + 8, eye, eye); ctx.fillRect(en.x + en.w - 6 - eye, en.y + 8, eye, eye);
    if (en.stun > 0) { ctx.strokeStyle = '#43e8d8'; ctx.beginPath(); ctx.arc(en.x + en.w/2, en.y + en.h/2, 24 + Math.sin(t/5)*3, 0, 7); ctx.stroke(); }
  }

  // игрок
  if (!(player.invuln > 0 && Math.floor(t/4) % 2 === 0)) {
    ctx.fillStyle = player.dashT > 0 ? '#9ffff2' : '#37c9b8';
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillStyle = '#43e8d8';
    ctx.fillRect(player.x + (player.face > 0 ? 16 : 6), player.y + 8, 6, 4);
  }
  // кольцо
  if (ring) {
    ctx.strokeStyle = 'rgba(67,232,216,' + Math.max(0, 1 - ring.r/PULSE_RADIUS) + ')';
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ring.x, ring.y, ring.r, 0, 7); ctx.stroke(); ctx.lineWidth = 1;
  }
  ctx.restore();

  // HUD
  ctx.fillStyle = '#cfe8ff'; ctx.font = '14px monospace';
  ctx.fillText('Уровень ' + (levelIdx + 1) + '/' + LEVELS.length, 12, 22);
  ctx.fillText('HP: ' + player.hp, 12, 40);
  ctx.fillStyle = player.pulseCd > 0 ? '#5a6b7d' : '#43e8d8';
  ctx.fillText(player.pulseCd > 0 ? 'ИМПУЛЬС: перезарядка' : 'ИМПУЛЬС: готов (E)', 12, 58);
  ctx.fillStyle = '#cfe8ff';
  ctx.fillText('Сложность x' + diff.toFixed(2), 12, 76);

  if (t - lastDeath < 90 && deaths > 0) {
    ctx.fillStyle = 'rgba(232,87,79,.9)'; ctx.font = 'bold 22px monospace';
    ctx.fillText('СБОЙ СИСТЕМЫ... ПЕРЕЗАПУСК С ЧЕКПОИНТА', W/2 - 230, H/2 - 60);
    ctx.font = '14px monospace';
  }
}

function loop() {
  if (state === 'play') { update(); draw(); }
  requestAnimationFrame(loop);
}

function startGame() {
  document.getElementById('overlay').style.display = 'none';
  levelIdx = 0; loadLevel(0); state = 'play';
  try { cv.focus(); } catch(e) {}
}

// клик по оверлею, клик по странице в целом и любая клавиша — всё запускает игру
document.getElementById('overlay').addEventListener('click', startGame);
document.addEventListener('mousedown', function() { if (state === 'menu') startGame(); });
window.addEventListener('keydown', function() { if (state === 'menu') startGame(); });

loadLevel(0);
loop();
})();
</script>
</body>
</html>
